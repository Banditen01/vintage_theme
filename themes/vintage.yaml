# A vintage style theme
# Creater: Anup - @surendrananup updated and adapted to HACS by @Banditen01
vintage-classic-modern:

  card-mod-theme: vintage-classic-modern

  #################################################
  # FONT
  #################################################

  primary-font-family: "Lucida Console"

  #################################################
  # COLORS
  #################################################

  turmeric-color: "#DEB853"
  light-turmeric-color: "#E2D9A2"

  slate-color: "#0A373A"
  medium-slate-color: "#48534A"
  light-slate-color: "#789F8A"
  grey-slate-color: "#919892"

  maroon-color: "#862715"
  text-color: "#FAFCFB"

  #################################################
  # WEB AWESOME (HA 2026)
  #################################################

  wa-color-brand-on-normal: "#0A373A"
  wa-color-brand-on-hover: "#0A373A"
  wa-color-brand-on-active: "#0A373A"

  wa-color-on-brand: "#0A373A"

  #################################################
  # TEXT
  #################################################

  primary-text-color: "#0A373A"
  secondary-text-color: "#0A373A"
  text-primary-color: "#0A373A"
  disabled-text-color: "#919892"

  #################################################
  # PRIMARY
  #################################################

  primary-color: "#0A373A"
  accent-color: "#862715"

  link-text-color: "#0A373A"
  text-accent-color: "#0A373A"

  #################################################
  # MATERIAL DESIGN 3
  #################################################

  md-sys-color-primary: "#0A373A"
  md-sys-color-secondary: "#862715"

  md-sys-color-on-primary: "#FAFCFB"
  md-sys-color-on-secondary: "#FAFCFB"

  mdc-theme-primary: "#0A373A"
  mdc-theme-secondary: "#DEB853"

  #################################################
  # BACKGROUND
  #################################################

  primary-background-color: "#E2D9A2"
  secondary-background-color: "#E2D9A2"

  material-background-color: "#E2D9A2"
  divider-color: "#E2D9A2"

  #################################################
  # HEADER
  #################################################

  app-header-background-color: "#0A373A"
  app-header-text-color: "#FAFCFB"

  #################################################
  # SIDEBAR
  #################################################

  sidebar-background-color: "#DEB853"

  sidebar-text-color: "#0A373A"
  sidebar-icon-color: "#0A373A"

  sidebar-selected-background-color: "#862715"
  sidebar-selected-text-color: "#FAFCFB"
  sidebar-selected-icon-color: "#FAFCFB"

  #################################################
  # CARDS
  #################################################

  card-background-color: "#789F8A"
  paper-card-background-color: "#789F8A"
  paper-dialog-background-color: "#789F8A"

  paper-card-header-color: "#0A373A"

  ha-card-border-radius: "15px"

  ha-card-box-shadow: >
    1px 1px 5px 0px rgb(12,12,14)

  #################################################
  # ICONS
  #################################################

  state-icon-color: "#0A373A"

  paper-item-icon-color: "#0A373A"
  paper-item-icon-active-color: "#862715"

  #################################################
  # SCRIPTS
  #################################################

  state-script-color: "#0A373A"

  #################################################
  # SWITCHES
  #################################################

  # OFF

  ha-switch-background-color: "#919892"
  ha-switch-border-color: "#0A373A"

  ha-switch-thumb-background-color: "#d3d5d3"
  ha-color-on-neutral: "#F3F3F3"

  # ON

  ha-switch-checked-background-color: "#E2D9A2"
  ha-switch-checked-border-color: "#0A373A"

  ha-switch-checked-thumb-background-color: "#862715"
  ha-switch-checked-thumb-border-color: "#0A373A"

  # Legacy

  paper-toggle-button-unchecked-bar-color: "#919892"
  paper-toggle-button-unchecked-button-color: "#F3F3F3"

  paper-toggle-button-checked-bar-color: "#862715"
  paper-toggle-button-checked-button-color: "#FAFCFB"

  # MDC

  mdc-switch-unselected-track-color: "#919892"
  mdc-switch-unselected-handle-color: "#F3F3F3"

  mdc-switch-selected-track-color: "#862715"
  mdc-switch-selected-handle-color: "#FAFCFB"

  #################################################
  # TABS
  #################################################

  paper-tabs-selection-bar-color: "#862715"

  #################################################
  # MUSHROOM
  #################################################

  mushroom-card-background-color: "#789F8A"

  mushroom-primary-text-color: "#0A373A"
  mushroom-secondary-text-color: "#48534A"

  #################################################
  # LEGACY FONT SUPPORT
  #################################################

  paper-font-common-base_-_font-family: "Lucida Console"
  paper-font-common-code_-_font-family: "Lucida Console"
  paper-font-body1_-_font-family: "Lucida Console"
  paper-font-subhead_-_font-family: "Lucida Console"
  paper-font-headline_-_font-family: "Lucida Console"
  paper-font-caption_-_font-family: "Lucida Console"
  paper-font-title_-_font-family: "Lucida Console"